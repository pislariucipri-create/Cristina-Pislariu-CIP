<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Intervenție | Cristina Pîslariu</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Quicksand', sans-serif; background: #e0dbd5; }

        /* NAV BAR */
        .nav-bar {
            position: sticky; top: 0; z-index: 200;
            background: #3e2723; height: 48px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.35);
            gap: 8px;
        }
        .nav-bar-left  { display: flex; align-items: center; gap: 6px; }
        .nav-bar-right { display: flex; align-items: center; gap: 6px; }
        .btn-nav {
            background: rgba(255,255,255,0.13); color: white; border: none;
            padding: 5px 13px; border-radius: 5px; cursor: pointer;
            font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 0.8rem;
            text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: 0.15s;
        }
        .btn-nav:hover { background: rgba(255,255,255,0.26); }
        .btn-nav.save  { background: #2e7d32; }
        .btn-nav.save:hover  { background: #1b5e20; }
        .btn-nav.pdf   { background: #5d4037; }
        .btn-nav.pdf:hover   { background: #4e342e; }
        .nav-title { color: rgba(255,255,255,0.75); font-size: 0.85rem; font-weight: 700; margin-left: 6px; }

        /* FORMAT BAR */
        .fmt-bar {
            position: sticky; top: 48px; z-index: 190;
            background: #faf7f3; border-bottom: 1px solid #ddd5c8;
            padding: 5px 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 2px;
        }
        .sep { width: 1px; height: 22px; background: #ccc; margin: 0 4px; flex-shrink: 0; }
        .fb {
            background: none; border: 1px solid transparent; border-radius: 3px;
            padding: 3px 7px; cursor: pointer; font-size: 0.8rem; color: #3e2723;
            font-family: 'Quicksand', sans-serif; transition: 0.12s;
            display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
        }
        .fb:hover { background: #ede8e2; border-color: #c9bbae; }
        .fb.on    { background: #ddd5cc; border-color: #b5a396; }
        .fsel {
            border: 1px solid #ccc; border-radius: 3px; padding: 3px 5px;
            font-family: 'Quicksand', sans-serif; font-size: 0.8rem;
            background: white; color: #3e2723; cursor: pointer; max-width: 130px;
        }
        .clr-wrap { position: relative; width: 26px; height: 26px; border-radius: 4px; overflow: hidden; border: 1px solid #ccc; }
        .clr-wrap input[type=color] { position: absolute; top: -4px; left: -4px; width: 38px; height: 38px; border: none; padding: 0; cursor: pointer; background: none; }
        .lbl { font-size: 0.7rem; color: #999; padding: 0 2px; }

        /* ZONA DOCUMENT */
        .doc-zone {
            padding: 28px 16px 60px;
            min-height: calc(100vh - 98px);
            display: flex; flex-direction: column; align-items: center;
        }
        .paper {
            background: white;
            width: 210mm; min-height: 297mm;
            padding: 20mm 22mm;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            color: #000;
            font-family: 'Times New Roman', serif;
            font-size: 13pt; line-height: 1.65;
            outline: none;
        }
        .paper:focus-within { box-shadow: 0 4px 24px rgba(0,0,0,0.2), 0 0 0 3px rgba(129,164,115,0.35); }

        /* Stiluri document */
        .paper h1 { font-size: 20pt; text-align: center; text-transform: uppercase; margin: 14px 0 8px; }
        .paper h2 { font-size: 15pt; margin: 14px 0 6px; border-bottom: 1px solid #aaa; padding-bottom: 3px; }
        .paper h3 { font-size: 12pt; margin: 10px 0 4px; }
        .paper p  { margin: 5px 0; min-height: 1.65em; }
        .paper table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 11pt; }
        .paper table td, .paper table th { border: 1px solid #000; padding: 6px 8px; vertical-align: top; min-width: 40px; }
        .paper table th { background: #f0f0f0; font-weight: bold; text-align: center; }
        .paper tr { page-break-inside: avoid; break-inside: avoid; }
        .paper ul, .paper ol { margin: 6px 0 6px 24px; }
        .paper li { margin: 3px 0; }
        .paper blockquote { border-left: 3px solid #81a473; margin: 8px 0; padding: 5px 14px; color: #555; font-style: italic; }
        .paper hr { border: none; border-top: 1px solid #bbb; margin: 14px 0; }
        .paper a { color: #2e7d32; }

        /* PANOU "DOAR PSIHOLOG" — matrice scoruri pe ședințe */
        .psi-only-panel {
            background: #fff8ec; border: 2px dashed #d7a24a; border-radius: 10px;
            width: 210mm; max-width: 100%; margin: 18px 0 40px; padding: 16px 20px;
            color: #5a4324; font-family: 'Quicksand', sans-serif;
        }
        .psi-only-badge {
            display: inline-block; background: #d7a24a; color: white;
            font-size: 0.75rem; font-weight: 700; padding: 3px 12px;
            border-radius: 20px; margin-bottom: 8px;
        }
        .psi-only-panel h3 { font-family: 'Quicksand', sans-serif; font-size: 1.05rem; color: #5a4324; }
        table.score-matrix { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
        table.score-matrix th, table.score-matrix td {
            border: 1px solid #e3cfa0; padding: 5px 9px; text-align: left;
        }
        table.score-matrix th { background: #f4e3c1; font-weight: 700; white-space: nowrap; }
        table.score-matrix td { white-space: nowrap; }
        @media print { .psi-only-panel { display: none !important; } }
        .month-filter { margin: 8px 0 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .month-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.8rem; background: #fff; border: 1px solid #e3cfa0; border-radius: 12px; padding: 3px 10px; cursor: pointer; user-select: none; }
        .month-chip input { accent-color: #d7a24a; cursor: pointer; }

        /* ISTORIC VERSIUNI PLAN */
        .v-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .v-item {
            display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
            background: #fff; border: 1px solid #e3cfa0; border-radius: 10px; padding: 9px 13px;
        }
        .v-item > div:first-child { flex: 1 1 210px; min-width: 0; }
        .v-when { font-weight: 700; font-size: 0.87rem; color: #5a4324; }
        .v-meta { font-size: 0.76rem; color: #a68b5b; margin-top: 1px; }
        .v-tag  { background: #f4e3c1; border-radius: 10px; padding: 2px 9px; font-size: 0.7rem; font-weight: 700; margin-left: 6px; }
        .v-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-v {
            background: #8d6e63; color: #fff; border: 1px solid transparent; border-radius: 6px;
            padding: 4px 11px; font-family: 'Quicksand', sans-serif; font-weight: 700;
            font-size: 0.76rem; cursor: pointer; transition: 0.15s; white-space: nowrap;
        }
        .btn-v:hover  { background: #6d4c41; }
        .btn-v.ghost  { background: #fff; color: #8d6e63; border-color: #d7b98a; }
        .btn-v.ghost:hover  { background: #f8efe0; }
        .btn-v.danger { background: #fff; color: #c62828; border-color: #eabdbd; }
        .btn-v.danger:hover { background: #fdeeee; }
        .v-empty { font-size: 0.85rem; color: #a68b5b; }
        .v-sql {
            background: #3e2723; color: #f6e7c8; border-radius: 8px; margin-top: 9px;
            font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem;
            line-height: 1.55; padding: 12px 14px; white-space: pre; overflow-x: auto;
        }

        /* Modal previzualizare versiune */
        .v-modal {
            position: fixed; inset: 0; z-index: 500; background: rgba(34,22,15,.66);
            display: block; padding: 16px 10px 40px; overflow-y: auto;
        }
        .v-modal-bar {
            position: sticky; top: 0; z-index: 2;
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            background: #3e2723; color: #fff; border-radius: 10px;
            padding: 9px 13px; margin: 0 auto 14px; width: 210mm; max-width: 100%;
            box-shadow: 0 4px 16px rgba(0,0,0,.3);
        }
        .v-modal-title { font-weight: 700; font-size: 0.85rem; margin-right: auto; }
        /* height auto + margin auto: documentul crește cât e nevoie, nu e strivit de înălțimea ecranului */
        .v-modal .paper { margin: 0 auto; max-width: 100%; height: auto; }

        /* Loading */
        .loading { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: #666; font-size: 1.1rem; gap: 10px; }

        /* VEDERE PARINTE */
        .p-wrap { max-width: 900px; margin: 36px auto; padding: 0 20px 60px; }
        .p-header {
            background: linear-gradient(135deg, #4e3629, #6d4a37);
            color: white; border-radius: 18px; padding: 26px 32px;
            margin-bottom: 26px; text-align: center;
        }
        .p-header h1 { font-size: 1.55rem; margin-bottom: 7px; }
        .p-header p  { opacity: .8; font-size: .92rem; }
        .p-header .badge {
            display: inline-block; margin-top: 10px;
            background: rgba(255,255,255,.18); padding: 3px 13px;
            border-radius: 20px; font-size: .78rem; font-weight: 700;
        }
        .p-noplan {
            background: white; border-radius: 18px; text-align: center;
            padding: 3.5rem 2rem; color: #aaa;
            box-shadow: 0 4px 18px rgba(0,0,0,.05);
        }
        .p-noplan .ico { font-size: 2.8rem; display: block; margin-bottom: .9rem; }
        .p-planbox {
            background: white; border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,.07);
            padding: 28px 32px;
            font-family: 'Times New Roman', serif; font-size: 12.5pt; line-height: 1.7;
        }
        .p-planbox table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 11pt; }
        .p-planbox td, .p-planbox th { border: 1px solid #000; padding: 6px 8px; }
        .p-planbox th { background: #f0f0f0; font-weight: bold; text-align: center; }
        .p-planbox h1 { font-size: 18pt; text-align: center; text-transform: uppercase; margin: 12px 0 6px; }
        .p-planbox h2 { font-size: 14pt; margin: 12px 0 5px; border-bottom: 1px solid #aaa; padding-bottom: 3px; }
        .p-planbox h3 { font-size: 12pt; margin: 10px 0 4px; }
        .p-planbox p  { margin: 5px 0; }

        /* Toast */
        .toast {
            position: fixed; bottom: 22px; right: 22px;
            background: #3e2723; color: white; padding: 13px 20px;
            border-radius: 14px; font-weight: 600;
            box-shadow: 0 6px 22px rgba(0,0,0,.2); z-index: 9999;
            display: none; font-size: .88rem; max-width: 320px;
        }
        .toast.show { display: flex; align-items: center; gap: 9px; }

        @media print {
            .nav-bar, .fmt-bar { display: none !important; }
            body { background: white; }
            .doc-zone { padding: 0; }
            .paper { box-shadow: none; width: 100%; min-height: auto; padding: 12mm; }
            .p-header { display: none; }
            .p-wrap { margin: 0; padding: 0; }
            .p-planbox { box-shadow: none; padding: 8mm; }
        }
        @media (max-width: 820px) {
            .paper { width: 100%; padding: 10mm; }
            .doc-zone { padding: 10px 0 40px; }
        }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- Nav bar -->
<div class="nav-bar" id="navBar" style="display:none;">

</div>

<!-- Format bar (psiholog only) -->
<div class="fmt-bar" id="fmtBar" style="display:none;">

    <button class="fb" onclick="ex('undo')" title="Ctrl+Z">↩</button>

    <button class="fb" onclick="ex('justifyLeft')"   title="Stânga">⬅</button>

    <button class="fb" onclick="ex('insertUnorderedList')" title="Listă buline">• Listă</button>

<!-- Conținut -->
<div id="appContent">
    <div class="loading"><span>⏳</span> Se încarcă...</div>
</div>

<script>
    const SUPABASE_URL = 'https://yexvpbgkrzerkizscgfn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_q52fh6Xa3yNm3q0akTrKKw_7AlxLrCU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getSession() { try { return JSON.parse(sessionStorage.getItem('session')||'null'); } catch { return null; } }

    const session = getSession();
    const pid = new URLSearchParams(window.location.search).get('id');
    let currentPatientId = null, planId = null, paper = null;

    window.onload = async function() {
        if (!session) { window.location.href = 'index.html'; return; }
        session.role === 'psiholog' ? await initPsiholog() : await initParinte();
    };

    /* ═══════════════════════════════════
       PSIHOLOG
    ═══════════════════════════════════ */
    async function initPsiholog() {
        if (!pid) { showErr('Niciun copil selectat. Mergi la <a href="fisa-notare.html">participanți</a>.'); return; }
        currentPatientId = pid;

        document.getElementById('navBar').style.display = 'flex';
        document.getElementById('fmtBar').style.display = 'flex';

        document.getElementById('navLeft').innerHTML =
            '<a class="btn-nav" href="index.html">🏠 Acasă</a>' +
            '<a class="btn-nav" href="fisa-notare.html">← Participanți</a>' +
            '<span class="nav-title" id="ntitle">Plan de intervenție</span>';
        document.getElementById('navRight').innerHTML =
            '<button class="btn-nav" title="Aduce tabelul Strategii exact la obiectivele din ultima ședință" onclick="regenerateStrategiiTable()" style="background:#8d6e63;">🔄 Sincronizează tabel</button>' +
            '<button class="btn-nav" title="Versiunile salvate ale planului" onclick="scrollLaIstoric()">🕘 Istoric</button>' +
            '<button class="btn-nav save" onclick="savePlan()">💾 Salvează</button>' +
            '<button class="btn-nav pdf" id="btnPdfPsi" onclick="exportPDF()">🖨️ PDF</button>';

        const [{ data: patient }, { data: plan }, { data: fisa }] = await Promise.all([
            _supabase.from('patients').select('*').eq('id', pid).single(),
            _supabase.from('intervention_plans').select('*').eq('patient_id', pid).maybeSingle(),
            _supabase.from('fisa_data').select('data').eq('patient_id', pid).maybeSingle()
        ]);

        if (patient) document.getElementById('ntitle').textContent = 'Plan — ' + patient.name;
        currentPatientName = patient ? patient.name : '';

        if (plan) planId = plan.id;
        buildEditor(patient, plan ? plan.html_content : null, fisa ? fisa.data : null);

        // Istoricul versiunilor
        ultimaVersiuneSalvata = (plan && plan.html_content) ? plan.html_content : '';
        await loadPlanVersions();
        // Planul exista deja înainte de istoric → îl arhivăm o dată, ca punct de pornire
        if (!versiuniIndisponibile && !planVersions.length && plan && plan.html_content) {
            await savePlanVersion(plan.html_content, 'starea planului la pornirea istoricului');
        }
    }

    /* ── MATRICE SCORURI (vizibilă doar psihologului, nu se salvează în plan) ── */
    let scoreMatrixExport = null; // date brute pentru exportul Excel

    function buildScoreMatrix(patient, sessions) {
        scoreMatrixExport = null;
        if (!sessions || !sessions.length) return '';
        // Ignorăm formatul vechi (fără date de ședință)
        if (sessions[0] && sessions[0].catName !== undefined) return '';

        const sorted = [...sessions]
            .filter(s => (s.categories||[]).length)
            .sort((a,b) => new Date(a.date||0) - new Date(b.date||0));
        if (!sorted.length) return '';

        // Colectăm domenii/obiective unice, păstrând ordinea apariției
        const catOrder = [];
        const catMap = {};
        sorted.forEach(s => (s.categories||[]).forEach(cat => {
            if (!catMap[cat.catName]) { catMap[cat.catName] = []; catOrder.push(cat.catName); }
            (cat.subItems||[]).forEach(item => {
                if (!catMap[cat.catName].includes(item.name)) catMap[cat.catName].push(item.name);
            });
        }));

        const dateLabelsShort = sorted.map(s => s.date ? new Date(s.date).toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—');
        const dateLabelsFull  = sorted.map(s => s.date ? new Date(s.date).toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—');
        const colMonths = sorted.map(s => s.date ? s.date.slice(0,7) : '');
        const dateHeaders = dateLabelsShort.map((d,i) => '<th data-month="'+colMonths[i]+'">'+d+'</th>').join('');

        let bodyRows = '';
        const exportRows = [['Domeniu / Obiectiv', ...dateLabelsFull]];
        catOrder.forEach(catName => {
            bodyRows += '<tr><td colspan="'+(sorted.length+1)+'" style="background:#f4e3c1;"><strong>📂 '+catName+'</strong></td></tr>';
            exportRows.push(['📂 ' + catName]);
            catMap[catName].forEach(objName => {
                const scores = sorted.map(s => {
                    const cat = (s.categories||[]).find(c => c.catName === catName);
                    const item = cat ? (cat.subItems||[]).find(i => i.name === objName) : null;
                    return (item && item.scores) ? item.scores : '';
                });
                const cells = scores.map((sc,i) => '<td data-month="'+colMonths[i]+'" style="text-align:center;">'+(sc || '—')+'</td>').join('');
                bodyRows += '<tr><td>Ob: '+(objName||'')+'</td>'+cells+'</tr>';
                exportRows.push(['Ob: ' + (objName||''), ...scores]);
            });
        });

        scoreMatrixExport = { patientName: patient ? patient.name : '', rows: exportRows, colMonths };

        // Bife pe luni, ca să poți alege rapid ce luni intră în tabel/export
        const monthOrder = [];

        return '<div class="psi-only-panel">' +

                '<span class="psi-only-badge">🔒 Vizibil doar pentru psiholog — nu apare în planul trimis părintelui</span>' +

            '</div>' +
            '<h3>Evidență scoruri pe ședințe</h3>' +
            monthFilterHtml +
            '<div style="overflow-x:auto;">' +
            '<table class="score-matrix" id="scoreMatrixTable"><thead><tr><th>Nume: '+(patient?patient.name:'')+'</th>'+dateHeaders+'</tr></thead>' +
            '<tbody>'+bodyRows+'</tbody></table>' +

    }

    function exportScoreMatrixExcel() {
        if (!scoreMatrixExport || !scoreMatrixExport.rows.length) { toast('Nu există date de exportat.', '⚠️'); return; }

        const hiddenMonths = new Set();
        document.querySelectorAll('.month-filter input[data-month-toggle]').forEach(cb => {
            if (!cb.checked) hiddenMonths.add(cb.getAttribute('data-month-toggle'));
        });
        const colMonths = scoreMatrixExport.colMonths || [];
        const keepIdx = colMonths.map((m,i) => hiddenMonths.has(m) ? -1 : i).filter(i => i !== -1);
        const rows = scoreMatrixExport.rows.map(row => {
            if (row.length <= 1) return row; // rând de titlu domeniu, fără coloane de date

            return [row[0], ...rest];

    /* ── OBIECTIVE DIN FIȘĂ — EXACT DIN ULTIMA ȘEDINȚĂ ──────────────────────────
       Tabelul "Strategii de Intervenție" oglindește ultima ședință individuală:
       aceleași domenii, aceleași obiective, aceeași ordine, aceleași valori.
       Obiectivele lucrate în ședințe mai vechi, dar care nu mai apar în ultima,
       nu mai intră în plan. Categoriile arhivate în fișă nu apar (sunt finalizate). */

    // true  → textul scris de mână în plan rămâne acolo unde ultima ședință are câmpul gol
    // false → copiere 1:1 din ultima ședință (câmp gol în fișă = celulă goală în plan)
    const PASTREAZA_TEXTUL_MANUAL = true;

    function getUltimaSedinta(fisaData) {
        if (!fisaData || !fisaData.length) return null;
        // format vechi: fisaData e deja o listă de categorii → o tratăm ca pe o singură ședință
        if (fisaData[0] && fisaData[0].catName !== undefined) {
            return { date: null, categories: fisaData };
        }
        const sortate = [...fisaData].sort((a, b) => new Date(a.date || 0) - new Date(b.date || 0));
        // Cea mai recentă ședință care are obiective: o ședință abia creată, încă goală,
        // nu golește planul părintelui.
        for (let i = sortate.length - 1; i >= 0; i--) {
            const areObiective = (sortate[i].categories || []).some(c => (c.subItems || []).length);
            if (areObiective) return sortate[i];
        }
        return null;
    }

    function collectAllObjectives(fisaData) {
        const s = getUltimaSedinta(fisaData);
        if (!s) return [];
        const out = [];
        (s.categories || []).forEach(cat => (cat.subItems || []).forEach(item => {
            out.push({ catName: cat.catName, item });
        }));
        return out;
    }

    function dataSedintei(s) {
        if (!s || !s.date) return '';
        const d = new Date(s.date);
        return isNaN(d) ? '' : d.toLocaleDateString('ro-RO');
    }

    function cheieObiectiv(domeniu, obiectiv) {
        return (domeniu || '').trim() + '|||' + (obiectiv || '').trim();
    }

    // Grupează obiectivele astfel încât toate rândurile cu același domeniu să fie alăturate,
    // chiar dacă în fișă apar amestecate din ședințe diferite.
    function groupObjsByDomain(objs) {
        const order = [];
        const map = new Map();
        objs.forEach(o => {
            const key = (o.catName || '').trim();
            if (!map.has(key)) { map.set(key, []); order.push(key); }
            map.get(key).push(o);
        });
        const out = [];
        order.forEach(key => out.push(...map.get(key)));
        return out;
    }

    // Randează un tbody din rânduri "plate" {catName, obOperational, sd, interventie, frecventa},
    // unind cu rowspan rândurile consecutive care au același domeniu (îl scrie o singură dată).
    function renderGroupedRows(flatRows, startNr) {
        let nr = (startNr || 0) + 1;
        let html = '';
        for (let i = 0; i < flatRows.length; i++) {
            const r = flatRows[i];
            const isGroupStart = (i === 0) || ((flatRows[i-1].catName||'').trim() !== (r.catName||'').trim());
            const nrText = isGroupStart ? String(nr++) : '';
            const domainText = isGroupStart ? '<b>'+(r.catName||'')+'</b>' : '';
            html += '<tr>' +
                '<td style="text-align:center;">'+nrText+'</td>' +
                '<td>'+domainText+'</td>' +
                '<td>'+(r.obOperational||'')+'</td>' +
                '<td style="text-align:center;">'+(r.sd||'')+'</td>' +
                '<td>'+(r.interventie||'')+'</td>' +
                '<td style="text-align:center;">'+(r.frecventa||'')+'</td>' +
            '</tr>';
        }
        return html;
    }

    function buildStrategiiRowsHtml(objs, startNr) {
        const grouped = groupObjsByDomain(objs);
        const flatRows = grouped.map(({catName, item}) => ({
            catName,
            obOperational: item.name || '',
            sd: item.persoana || '',
            interventie: item.detalii_extra || '',
            frecventa: item.locatie || ''
        }));
        return renderGroupedRows(flatRows, startNr);
    }

    // Citește un tabel deja randat (cu rowspan pe Domeniu) și îl întoarce în rânduri "plate",
    // păstrând orice a scris manual psihologul în celule.
    function flattenStrategiiTable(table) {
        const tbody = table.querySelector('tbody');
        const rows = [...tbody.querySelectorAll('tr')];
        let currentDomain = '';
        return rows.map(tr => {
            const tds = [...tr.querySelectorAll('td')];
            const domainText = tds[1] ? tds[1].textContent.trim() : '';
            const domain = domainText ? domainText : currentDomain;
            currentDomain = domain;
            return {
                catName: domain,
                obOperational: tds[2] ? tds[2].innerHTML : '',
                sd: tds[3] ? tds[3].innerHTML : '',
                interventie: tds[4] ? tds[4].innerHTML : '',
                frecventa: tds[5] ? tds[5].innerHTML : ''
            };
        });
    }

    function stripHtml(html) {
        const d = document.createElement('div');
        d.innerHTML = html || '';
        return (d.textContent || '').trim();
    }

    function renumberStrategiiTable(table) {
        [...table.querySelectorAll('tbody tr')].forEach((tr, i) => {
            const cells = tr.querySelectorAll('td');
            if (cells.length >= 6) cells[0].textContent = i + 1;
        });
    }

    /* ── SINCRONIZARE TABEL: oglindă exactă a ultimei ședințe din fișa individuală ── */
    async function regenerateStrategiiTable() {
        if (!currentPatientId) return;
        const { data: fisa } = await _supabase.from('fisa_data').select('data').eq('patient_id', currentPatientId).maybeSingle();
        const fisaData = fisa ? fisa.data : null;
        const ultimaSedinta = getUltimaSedinta(fisaData);
        const dataUltimei = dataSedintei(ultimaSedinta);
        const objs = collectAllObjectives(fisaData);
        if (!objs.length) { toast('Ultima ședință din fișa acestui copil nu are obiective.', 'ℹ️'); return; }
        if (!paper) { toast('Documentul nu este încărcat.', '⚠️'); return; }

        function isCorrectStructure(t) {
            if (!t) return false;
            const ths = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
            return ths.length === 6 && ths[0] && ths[0].startsWith('Nr');
        }

        let table = document.getElementById('tabelStrategii');
        if (!table) {
            // Planuri mai vechi: căutăm tabelul după titlul secțiunii
            const heading = [...paper.querySelectorAll('h2')].find(h => h.textContent.trim() === 'Strategii de Intervenție');
            if (heading && heading.nextElementSibling && heading.nextElementSibling.tagName === 'TABLE') {
                table = heading.nextElementSibling;
            }
        }

        if (table && !isCorrectStructure(table)) {
            if (!confirm('Tabelul "Strategii de Intervenție" din acest document are un format vechi.\n\nÎl înlocuiesc cu formatul nou (Nr. Crt. / Ob. general / Ob. operațional / Sd. / Recomandări acasă / Frecvență) și preiau obiectivele din ultima ședință' + (dataUltimei ? ' (' + dataUltimei + ')' : '') + '?\n\nAtenție: conținutul scris manual în acel tabel se va pierde.')) return;
            table.remove();
            table = null;
        }

        if (!table) {
            const newTableHtml =
                '<table id="tabelStrategii"><thead><tr>' +
                    '<th style="width:6%">Nr. Crt.</th><th style="width:18%">Ob. general</th>' +
                    '<th style="width:28%">Ob. operațional</th>' +
                    '<th style="width:8%">Sd.</th><th style="width:24%">Recomandări acasă</th>' +
                    '<th style="width:16%">Frecvență</th>' +
                '</tr></thead><tbody>' + buildStrategiiRowsHtml(objs) + '</tbody></table>';

            const heading = [...paper.querySelectorAll('h2')].find(h => h.textContent.trim() === 'Strategii de Intervenție');
            if (heading) {
                heading.insertAdjacentHTML('afterend', newTableHtml + '<br>');
            } else {
                paper.insertAdjacentHTML('beforeend', '<h2>Strategii de Intervenție</h2>' + newTableHtml + '<br>');
            }
            toast('Tabel creat din ședința' + (dataUltimei ? ' din ' + dataUltimei : ' cea mai recentă') + '. ✅');
            return;
        }

        // Tabel corect existent → îl reconstruim exact ca ultima ședință:
        // aceleași rânduri, în aceeași ordine. Ce nu mai apare în ultima ședință iese din tabel.
        const tbody = table.querySelector('tbody');
        const randuriVechi = flattenStrategiiTable(table);

        const vechiDupaCheie = new Map();
        randuriVechi.forEach(r => {
            const cheie = cheieObiectiv(r.catName, stripHtml(r.obOperational));
            if (!vechiDupaCheie.has(cheie)) vechiDupaCheie.set(cheie, r);
        });

        // Valoarea din ultima ședință comandă; unde ședința e goală, putem păstra ce e scris de mână.
        const valoare = (dinSedinta, dinTabel) => {
            if (dinSedinta) return dinSedinta;
            if (PASTREAZA_TEXTUL_MANUAL && dinTabel && stripHtml(dinTabel)) return dinTabel;
            return '';
        };

        const folosite = new Set();
        let adaugate = 0, actualizate = 0;

        const randuriNoi = groupObjsByDomain(objs).map(({ catName, item }) => {
            const cheie = cheieObiectiv(catName, item.name);
            const vechi = vechiDupaCheie.get(cheie);
            folosite.add(cheie);

            const rand = {
                catName: catName || '',
                // păstrăm formatarea existentă a obiectivului (bold, italic etc.), textul e identic
                obOperational: vechi ? vechi.obOperational : (item.name || ''),
                sd:          valoare(item.persoana || '',      vechi ? vechi.sd : ''),
                interventie: valoare(item.detalii_extra || '', vechi ? vechi.interventie : ''),
                frecventa:   valoare(item.locatie || '',       vechi ? vechi.frecventa : '')
            };

            if (!vechi) adaugate++;
            else if (stripHtml(vechi.sd) !== stripHtml(rand.sd) ||
                     stripHtml(vechi.interventie) !== stripHtml(rand.interventie) ||
                     stripHtml(vechi.frecventa) !== stripHtml(rand.frecventa)) actualizate++;

            return rand;
        });

        const deSters = randuriVechi.filter(r => !folosite.has(cheieObiectiv(r.catName, stripHtml(r.obOperational))));

        const cheiVechi = randuriVechi.map(r => cheieObiectiv(r.catName, stripHtml(r.obOperational))).join('###');
        const cheiNoi   = randuriNoi.map(r => cheieObiectiv(r.catName, stripHtml(r.obOperational))).join('###');
        const ordineSchimbata = cheiVechi !== cheiNoi;

        if (!adaugate && !actualizate && !deSters.length && !ordineSchimbata) {
            toast('Tabelul e deja identic cu ultima ședință' + (dataUltimei ? ' (' + dataUltimei + ')' : '') + '. ✅');
            return;
        }

        if (deSters.length) {
            const lista = deSters.slice(0, 12)
                .map(r => '• ' + (stripHtml(r.catName) ? stripHtml(r.catName) + ' — ' : '') + (stripHtml(r.obOperational) || '(rând gol)'))
                .join('\n');
            const rest = deSters.length > 12 ? '\n…și încă ' + (deSters.length - 12) : '';
            const ok = confirm(
                'Tabelul va oglindi exact ultima ședință' + (dataUltimei ? ' din ' + dataUltimei : '') + '.\n\n' +
                'Ies din tabel ' + deSters.length + ' rând(uri) care nu mai apar în ea:\n' + lista + rest + '\n\n' +
                'Textul scris manual pe aceste rânduri se pierde. Continui?'
            );
            if (!ok) return;
        }

        tbody.innerHTML = renderGroupedRows(randuriNoi, 0);

        const parti = [];
        if (adaugate) parti.push(adaugate + ' rând(uri) adăugat(e)');
        if (actualizate) parti.push(actualizate + ' actualizat(e)');
        if (deSters.length) parti.push(deSters.length + ' eliminat(e)');
        if (!parti.length) parti.push('ordinea rândurilor adusă la zi');
        toast('Tabel sincronizat cu ședința' + (dataUltimei ? ' din ' + dataUltimei : '') + ': ' + parti.join(', ') + '. ✅');
    }

    async function savePlan() {
        if (!paper) return;
        if (exportInCurs) { toast('Se pregătește un PDF chiar acum. Încearcă din nou în câteva secunde.', 'ℹ️'); return; }
        const html = paper.innerHTML;
        let res;
        if (planId) {
            res = await _supabase.from('intervention_plans').update({ html_content: html, updated_at: new Date().toISOString() }).eq('id', planId);
        } else {
            const ins = await _supabase.from('intervention_plans').insert([{ patient_id: currentPatientId, html_content: html }]).select().single();
            if (ins.data) planId = ins.data.id;
            res = ins;
        }

        if (res && res.error) { toast('Eroare: ' + res.error.message, '❌'); return; }

        // Fiecare salvare rămâne în istoric (dacă textul chiar s-a schimbat)
        const versiuneNoua = (html !== ultimaVersiuneSalvata) ? await savePlanVersion(html) : false;
        toast(versiuneNoua
            ? 'Salvat, trimis părintelui și adăugat în istoric. ✅'
            : 'Planul a fost salvat și trimis părintelui! ✅');
    }

    /* ═══════════════════════════════════
       ISTORIC VERSIUNI PLAN (doar psiholog)
       Fiecare salvare a planului se arhivează în tabelul plan_versions.
    ═══════════════════════════════════ */

    const SQL_PLAN_VERSIONS =
'create table if not exists public.plan_versions (\n' +
'  id uuid primary key default gen_random_uuid(),\n' +
'  patient_id uuid not null,\n' +
'  html_content text not null,\n' +
'  note text,\n' +
'  created_at timestamptz not null default now()\n' +
');\n\n' +
'create index if not exists plan_versions_patient_idx\n' +
'  on public.plan_versions (patient_id, created_at desc);\n\n' +
'alter table public.plan_versions enable row level security;\n\n' +
'create policy "plan_versions_all" on public.plan_versions\n' +
'  for all to anon, authenticated using (true) with check (true);';

    let planVersions = [];              // doar id + dată + notă; conținutul se ia la cerere
    let ultimaVersiuneSalvata = '';     // ca să nu arhivăm de două ori același text
    let currentPatientName = '';
    let versiuniIndisponibile = false;  // tabelul plan_versions nu există încă

    function esc(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function tabelulLipseste(err) {
        const m = ((err && err.message) || '') + ' ' + ((err && err.code) || '');
        return /does not exist|could not find the table|schema cache|42P01|PGRST205/i.test(m);
    }

    function momentVersiune(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return '—';
        return d.toLocaleDateString('ro-RO', { day:'2-digit', month:'long', year:'numeric' }) +
               ', ora ' + d.toLocaleTimeString('ro-RO', { hour:'2-digit', minute:'2-digit' });
    }

    function numeFisierVersiune(v, ext) {
        const d = new Date(v.created_at);
        const p = n => String(n).padStart(2, '0');
        const stamp = isNaN(d) ? 'versiune'
            : d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + '-' + p(d.getMinutes());
        const nume = (currentPatientName || 'pacient').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .trim().replace(/[^\w\-]+/g, '_');
        return 'Plan_' + nume + '_' + stamp + '.' + ext;
    }

    // Notă scurtă afișată sub dată, ca să recunoști versiunea fără să o deschizi
    function rezumatPlan(html) {
        const d = document.createElement('div');
        d.innerHTML = html || '';
        const t = d.querySelector('#tabelStrategii') || d.querySelector('table');
        const n = t ? t.querySelectorAll('tbody tr').length : 0;
        return n ? ('Strategii de intervenție: ' + n + ' rând(uri)') : 'Fără tabel de strategii';
    }

    function buildVersionsPanel() {
        return '<div class="psi-only-panel" id="versionsPanel">' +
            '<span class="psi-only-badge">🔒 Vizibil doar pentru psiholog — nu apare în planul trimis părintelui</span>' +
            '<h3>Istoricul planului</h3>' +
            '<p style="font-size:.82rem;color:#a68b5b;margin-top:3px;">Fiecare salvare rămâne aici. Poți deschide o versiune veche, o poți descărca în PDF sau Word, sau o poți readuce în editor.</p>' +
            '<div class="v-list" id="versionsList"><p class="v-empty">Se încarcă istoricul…</p></div>' +
        '</div>';
    }

    async function loadPlanVersions() {
        const box = document.getElementById('versionsList');
        const { data, error } = await _supabase.from('plan_versions')
            .select('id, created_at, note')
            .eq('patient_id', currentPatientId)
            .order('created_at', { ascending: false })
            .limit(100);

        if (error) {
            versiuniIndisponibile = tabelulLipseste(error);
            if (box) box.innerHTML = versiuniIndisponibile
                ? htmlSetupSQL()
                : '<p class="v-empty">Nu am putut încărca istoricul: ' + esc(error.message) + '</p>';
            return;
        }

        versiuniIndisponibile = false;
        planVersions = data || [];
        renderVersionsList();
    }

    function renderVersionsList() {
        const box = document.getElementById('versionsList');
        if (!box) return;

        if (!planVersions.length) {
            box.innerHTML = '<p class="v-empty">Nicio versiune încă. La prima apăsare pe „💾 Salvează", planul de acum intră în istoric.</p>';
            return;
        }

        box.innerHTML = planVersions.map((v, i) =>
            '<div class="v-item">' +
                '<div>' +
                    '<div class="v-when">' + momentVersiune(v.created_at) +
                        (i === 0 ? '<span class="v-tag">versiunea trimisă părintelui</span>' : '') + '</div>' +
                    (v.note ? '<div class="v-meta">' + esc(v.note) + '</div>' : '') +
                '</div>' +
                '<div class="v-actions">' +
                    '<button class="btn-v ghost" onclick="previewVersion(\'' + v.id + '\')">👁 Vezi</button>' +
                    '<button class="btn-v" onclick="downloadVersionPDF(\'' + v.id + '\')">⬇ PDF</button>' +
                    '<button class="btn-v ghost" onclick="downloadVersionWord(\'' + v.id + '\')">⬇ Word</button>' +
                    '<button class="btn-v ghost" onclick="restoreVersion(\'' + v.id + '\')">♻ Readu în editor</button>' +
                    '<button class="btn-v danger" onclick="deleteVersion(\'' + v.id + '\')" title="Șterge versiunea">🗑</button>' +
                '</div>' +
            '</div>'
        ).join('');
    }

    async function savePlanVersion(html, notaExtra) {
        if (versiuniIndisponibile) return false;
        const note = rezumatPlan(html) + (notaExtra ? ' — ' + notaExtra : '');
        const { error } = await _supabase.from('plan_versions')
            .insert([{ patient_id: currentPatientId, html_content: html, note: note }]);

        if (error) {
            versiuniIndisponibile = tabelulLipseste(error);
            const box = document.getElementById('versionsList');
            if (versiuniIndisponibile && box) box.innerHTML = htmlSetupSQL();
            else if (box) toast('Planul e salvat, dar nu a intrat în istoric: ' + error.message, '⚠️');
            return false;
        }

        ultimaVersiuneSalvata = html;
        await loadPlanVersions();
        return true;
    }

    async function fetchVersion(id) {
        const { data, error } = await _supabase.from('plan_versions').select('*').eq('id', id).maybeSingle();
        if (error || !data) { toast('Nu am putut încărca versiunea.', '❌'); return null; }
        return data;
    }

    function closeVersionModal() {
        const m = document.getElementById('vModal');
        if (m) m.remove();
        document.removeEventListener('keydown', escInchideModal);
    }
    function escInchideModal(e) { if (e.key === 'Escape') closeVersionModal(); }

    async function previewVersion(id) {
        const v = await fetchVersion(id);
        if (!v) return;
        closeVersionModal();

        const wrap = document.createElement('div');
        wrap.className = 'v-modal';
        wrap.id = 'vModal';
        wrap.onclick = e => { if (e.target === wrap) closeVersionModal(); };
        wrap.innerHTML =
            '<div class="v-modal-bar">' +
                '<span class="v-modal-title">Versiune din ' + momentVersiune(v.created_at) + '</span>' +
                '<button class="btn-v" onclick="downloadVersionPDF(\'' + v.id + '\')">⬇ PDF</button>' +
                '<button class="btn-v ghost" onclick="downloadVersionWord(\'' + v.id + '\')">⬇ Word</button>' +
                '<button class="btn-v ghost" onclick="restoreVersion(\'' + v.id + '\')">♻ Readu în editor</button>' +
                '<button class="btn-v ghost" onclick="closeVersionModal()">✕ Închide</button>' +
            '</div>' +
            '<div class="paper" id="vPaper"></div>';
        document.body.appendChild(wrap);

        const vp = document.getElementById('vPaper');
        vp.innerHTML = v.html_content || '';
        vp.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = 'false');
        document.addEventListener('keydown', escInchideModal);
    }

    async function downloadVersionPDF(id) {
        const v = await fetchVersion(id);
        if (!v) return;
        if (!paper) { toast('Documentul nu este încărcat.', '⚠️'); return; }
        if (exportInCurs) { toast('Un export e deja în lucru.', 'ℹ️'); return; }

        // Randăm versiunea chiar în foaia din editor: e singurul element cu lățime,
        // stiluri și poziție reale. Un element ascuns în afara ecranului iese pagină albă.
        exportInCurs = true;
        const continutCurent = paper.innerHTML;
        const scrollInitial = window.scrollY;

        paper.innerHTML = v.html_content || '';
        window.scrollTo(0, 0);
        toast('Se pregătește PDF-ul…', '⏳');
        await asteptaRandare();

        try {
            await html2pdf().set(optiuniPDF(numeFisierVersiune(v, 'pdf'))).from(paper).save();
            toast('PDF descărcat. ✅');
        } catch (e) {
            toast('Eroare la export: ' + e.message, '❌');
        } finally {
            paper.innerHTML = continutCurent;
            window.scrollTo(0, scrollInitial);
            exportInCurs = false;
        }
    }

    async function downloadVersionWord(id) {
        const v = await fetchVersion(id);
        if (!v) return;
        const doc =
            '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
            '<head><meta charset="utf-8"><title>Plan de intervenție</title><style>' +
            '@page { size: A4; margin: 20mm 18mm; }' +
            'body { font-family: "Times New Roman", serif; font-size: 13pt; line-height: 1.6; }' +
            'h1 { font-size: 20pt; text-align: center; text-transform: uppercase; }' +
            'h2 { font-size: 15pt; border-bottom: 1px solid #aaa; padding-bottom: 3px; }' +
            'h3 { font-size: 12pt; }' +
            'table { border-collapse: collapse; width: 100%; font-size: 11pt; }' +
            'td, th { border: 1px solid #000; padding: 6px 8px; vertical-align: top; }' +
            'th { background: #f0f0f0; font-weight: bold; text-align: center; }' +
            '</style></head><body>' + (v.html_content || '') + '</body></html>';
        descarcaFisier(doc, numeFisierVersiune(v, 'doc'), 'application/msword');
    }

    function descarcaFisier(continut, nume, tip) {
        const blob = new Blob(['\ufeff' + continut], { type: tip + ';charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = nume;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        toast('Fișier descărcat: ' + nume, '⬇️');
    }

    async function restoreVersion(id) {
        const v = await fetchVersion(id);
        if (!v) return;
        if (!paper) { toast('Documentul nu este încărcat.', '⚠️'); return; }

        const cand = momentVersiune(v.created_at);
        const ok = confirm(
            'Readuc în editor versiunea din ' + cand + '?\n\n' +
            'Ce ai acum pe ecran și nu ai salvat se pierde. Versiunile din istoric rămân toate.\n\n' +
            'După restaurare apasă „💾 Salvează" ca părintele să vadă această variantă.'
        );
        if (!ok) return;

        closeVersionModal();
        paper.innerHTML = v.html_content || '';
        paper.scrollIntoView({ behavior: 'smooth', block: 'start' });
        toast('Versiunea din ' + cand + ' e în editor. Apasă „💾 Salvează" ca să o trimiți părintelui.', '♻️');
    }

    async function deleteVersion(id) {
        const v = planVersions.find(x => x.id === id);
        const cand = v ? momentVersiune(v.created_at) : 'aceasta';
        if (!confirm('Ștergi definitiv versiunea din ' + cand + '?\n\nNu se mai poate recupera.')) return;

        const { error } = await _supabase.from('plan_versions').delete().eq('id', id);
        if (error) { toast('Eroare: ' + error.message, '❌'); return; }
        toast('Versiune ștearsă din istoric.', '🗑');
        await loadPlanVersions();
    }

    function scrollLaIstoric() {
        const p = document.getElementById('versionsPanel');
        if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function htmlSetupSQL() {
        return '<p class="v-empty"><b>Istoricul are nevoie de un tabel nou în Supabase.</b><br>' +
            'Deschide Supabase → SQL Editor, rulează o singură dată scriptul de mai jos, apoi reîncarcă pagina. ' +
            'Dacă în tabelul <b>patients</b> coloana <b>id</b> nu e de tip uuid, ci număr, schimbă în script <b>patient_id uuid</b> în <b>patient_id bigint</b>.</p>' +
            '<div class="v-sql">' + esc(SQL_PLAN_VERSIONS) + '</div>' +
            '<div style="margin-top:9px;"><button class="btn-v" onclick="copiazaSQL()">📋 Copiază scriptul</button></div>';
    }

    function copiazaSQL() {
        navigator.clipboard.writeText(SQL_PLAN_VERSIONS)
            .then(() => toast('Script copiat. Rulează-l în Supabase → SQL Editor.', '📋'))
            .catch(() => toast('Selectează textul din casetă și copiază-l manual.', 'ℹ️'));
    }

    /* ═══════════════════════════════════
       COMENZI EDITOR
    ═══════════════════════════════════ */
    function ex(cmd, val) { document.execCommand(cmd, false, val||null); if(paper) paper.focus(); }
    function blk(tag) { if(!tag) return; document.execCommand('formatBlock', false, tag); if(paper) paper.focus(); }

    function nearestTag(tag) {
        const sel = window.getSelection();
        if (!sel || !sel.anchorNode) return null;
        let node = sel.anchorNode;
        while (node && node !== paper) { if (node.nodeName === tag) return node; node = node.parentNode; }
        return null;
    }
    function focusCell(el) {
        if (!el) return;
        el.focus();
        const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }

    function doInsertTable() {
        const cols = parseInt(prompt('Câte coloane?','3')||'3');
        const rows = parseInt(prompt('Câte rânduri (fără header)?','3')||'3');
        if (!cols || !rows) return;
        let h = '<table><thead><tr>';
        for (let c=0;c<cols;c++) h += '<th>Coloana '+(c+1)+'</th>';
        h += '</tr></thead><tbody>';
        for (let r=0;r<rows;r++) { h += '<tr>'; for (let c=0;c<cols;c++) h += '<td>&nbsp;</td>'; h += '</tr>'; }
        h += '</tbody></table><p><br></p>';
        ex('insertHTML', h);
    }

    function doAddRow() {
        const cell = nearestTag('TD') || nearestTag('TH');
        if (!cell) { toast('Pune cursorul într-o celulă din tabel.','ℹ️'); return; }
        const row = cell.closest('tr');
        const cols = row.querySelectorAll('td,th').length;
        const nr = document.createElement('tr');
        for (let i=0;i<cols;i++) { const td=document.createElement('td'); td.innerHTML='&nbsp;'; nr.appendChild(td); }
        row.after(nr);
        focusCell(nr.querySelector('td'));
    }

    function doAddCol() {
        const cell = nearestTag('TD') || nearestTag('TH');
        if (!cell) { toast('Pune cursorul într-o celulă din tabel.','ℹ️'); return; }
        const table = cell.closest('table');
        table.querySelectorAll('tr').forEach(row => {
            const cells = [...row.querySelectorAll('td,th')];
            const idx = cells.indexOf(cell) !== -1 ? cells.indexOf(cell) : cells.length - 1;
            const nc = row.querySelector('th') ? document.createElement('th') : document.createElement('td');
            nc.innerHTML = '&nbsp;';
            cells[idx+1] ? row.insertBefore(nc, cells[idx+1]) : row.appendChild(nc);
        });
    }

    function doDelRow() {
        const cell = nearestTag('TD') || nearestTag('TH');
        if (!cell) { toast('Pune cursorul într-un rând.','ℹ️'); return; }
        cell.closest('tr').remove();
    }

    function doDelCol() {
        const cell = nearestTag('TD') || nearestTag('TH');
        if (!cell) { toast('Pune cursorul într-o coloană.','ℹ️'); return; }
        const table = cell.closest('table');
        table.querySelectorAll('tr').forEach(row => {
            const cells = [...row.querySelectorAll('td,th')];
            const idx = cells.findIndex(c => c === cell);
            if (idx !== -1 && cells[idx]) cells[idx].remove();
        });
    }

    function doHR()    { ex('insertHTML','<hr><p><br></p>'); }
    function doLink()  { const u=prompt('URL:','https://'); if(u) ex('createLink',u); }
    function doImage() { const u=prompt('URL imagine:','https://'); if(u) ex('insertHTML','<img src="'+u+'" style="max-width:100%;height:auto;">'); }

    /* ═══════════════════════════════════
       PARINTE
    ═══════════════════════════════════ */
    async function initParinte() {
        document.getElementById('navBar').style.display = 'flex';
        document.getElementById('navLeft').innerHTML =
            '<a class="btn-nav" href="index.html">🏠 Acasă</a>' +
            '<span class="nav-title">📋 Planul meu de intervenție</span>';
        document.getElementById('navRight').innerHTML =
            '<button class="btn-nav pdf" id="btnPdfP" onclick="exportPDF()">🖨️ PDF</button>';

        const { data: patient } = await _supabase.from('patients').select('*').eq('email', session.email).maybeSingle();
        if (!patient) {
            document.getElementById('appContent').innerHTML =
                '<div class="p-wrap"><div class="p-noplan"><span class="ico">⚠️</span>' +
                '<p>Nu am găsit un profil asociat contului tău.</p>' +
                '<p style="margin-top:8px;font-size:.88rem;color:#bbb;">Contactează psihologul.</p></div></div>';
            return;
        }

        const { data: plan } = await _supabase.from('intervention_plans').select('*').eq('patient_id', patient.id).maybeSingle();
        const upd = plan && plan.updated_at
            ? new Date(plan.updated_at).toLocaleDateString('ro-RO',{day:'2-digit',month:'long',year:'numeric'}) : null;

        const hdr =
            '<div class="p-wrap">' +
            '<div class="p-header">' +
            '<h1>Planul de intervenție pentru '+patient.name+'</h1>' +
            '<p>Cabinet individual de psihologie — Cristina Pîslariu</p>' +
            (upd ? '<span class="badge">Actualizat: '+upd+'</span>' : '') +
            '</div>';

        if (!plan || !plan.html_content) {
            document.getElementById('appContent').innerHTML = hdr +
                '<div class="p-noplan"><span class="ico">📄</span>' +
                '<p>Planul nu a fost încă creat de psiholog.</p>' +
                '<p style="margin-top:8px;font-size:.88rem;color:#bbb;">Revino mai târziu sau contactează cabinetul.</p>' +
                '</div></div>';
            return;
        }

        document.getElementById('appContent').innerHTML = hdr +
            '<div class="p-planbox">'+plan.html_content+'</div></div>';

        // Read-only
        document.getElementById('appContent').querySelectorAll('[contenteditable]').forEach(el => {
            el.contentEditable = 'false';
            el.style.outline = 'none';
        });
    }

    /* ── HELPERS ── */
    function showErr(msg) {
        document.getElementById('appContent').innerHTML =
            '<div style="text-align:center;padding:4rem 2rem;color:#c62828;">' +
            '<span style="font-size:2.5rem;display:block;margin-bottom:1rem;">⚠️</span><p>'+msg+'</p></div>';
    }
    function toast(msg, icon) {
        icon = icon||'✅';
        const t = document.getElementById('toast');
        t.innerHTML = '<span>'+icon+'</span><span>'+msg+'</span>';
        t.classList.add('show');
        clearTimeout(t._t);
        t._t = setTimeout(()=>t.classList.remove('show'), 3500);
    }

    /* ── EXPORT PDF COMPLET (tot documentul, nu doar ecranul) ── */
    let exportInCurs = false;

    // html2canvas fotografiază pagina de la poziția curentă de scroll: dacă ești
    // derulat în jos (de exemplu la istoric), iese o pagină albă. De aceea urcăm la 0.
    function optiuniPDF(filename) {
        return {
            margin: [0, 0, 0, 0],
            filename: filename,
            image: { type: 'jpeg', quality: 0.97 },
            html2canvas: { scale: 2, useCORS: true, scrollX: -window.scrollX, scrollY: -window.scrollY },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };
    }

    // Lăsăm browserul să așeze textul (și fonturile) înainte de fotografie
    async function asteptaRandare() {
        if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        await new Promise(r => setTimeout(r, 120));
    }

    async function exportPDF() {
        const el = document.querySelector('.paper') || document.querySelector('.p-planbox');
        if (!el) { toast('Nu există conținut de exportat.', '⚠️'); return; }
        if (exportInCurs) { toast('Un export e deja în lucru.', 'ℹ️'); return; }

        const btn = document.getElementById('btnPdfPsi') || document.getElementById('btnPdfP');
        if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }

        exportInCurs = true;
        const scrollInitial = window.scrollY;
        window.scrollTo(0, 0);
        await asteptaRandare();

        try {
            await html2pdf().set(optiuniPDF('Plan_Interventie.pdf')).from(el).save();
        } catch(e) {
            toast('Eroare la export: ' + e.message, '❌');
        } finally {
            window.scrollTo(0, scrollInitial);
            exportInCurs = false;
        }

        if (btn) { btn.textContent = '🖨️ PDF'; btn.disabled = false; }
    }
</script>
